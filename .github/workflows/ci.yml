# T-504: portão automático antes de aceitar uma mudança.
# ESTADO: CONFIGURADO, NÃO EXECUTADO aqui (o repositório privado ainda não roda este workflow; sintaxe revisada à mão, sem actionlint).
# Os passos repetem os comandos do README/Makefile (`make test`), que é o que foi executado localmente.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # só erros de sintaxe e nomes não definidos (F, E9): o projeto ainda não tem configuração de estilo do ruff
      - run: pip install ruff==0.17.4
      - run: ruff check --select F,E9 analise classificador loader scripts tests

  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # Python: pytest no container do loader contra o Postgres do compose (migra, depois roda tests/)
      - run: docker compose up -d --wait db
      - run: docker compose run --build --rm loader sh -c "python -m loader.migrar && python -m pytest /app/tests -q -p no:cacheprovider"
      # TypeScript: tsc estrito e vitest (inclui a fumaça contra o banco do compose, que o passo acima já migrou)
      - run: docker compose --profile testes run --build --rm app-testes sh -c "npx tsc --noEmit && npx vitest run"
      - if: always()
        run: docker compose down -v

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acaso}
      POSTGRES_USER: ${POSTGRES_USER:-loader_rw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acaso_dev}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  loader:
    build:
      context: .
      dockerfile: loader/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      POSTGRES_DB: ${POSTGRES_DB:-acaso}
      POSTGRES_USER: ${POSTGRES_USER:-loader_rw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acaso_dev}
      APP_RO_PASSWORD: ${APP_RO_PASSWORD:-acaso_ro_dev}
    volumes:
      - ./sql:/app/sql:ro
      - ./analise:/app/analise:ro
      - ./tests:/app/tests:ro
      - ./data/bruto:/app/data/bruto:ro
      - ./seeds:/app/seeds:ro

volumes:
  pgdata:

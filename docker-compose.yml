services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acaso}
      POSTGRES_USER: ${POSTGRES_USER:-loader_rw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acaso_dev}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  loader:
    build:
      context: .
      dockerfile: loader/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      POSTGRES_DB: ${POSTGRES_DB:-acaso}
      POSTGRES_USER: ${POSTGRES_USER:-loader_rw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acaso_dev}
      APP_RO_PASSWORD: ${APP_RO_PASSWORD:-acaso_ro_dev}
    volumes:
      - ./sql:/app/sql:ro
      - ./analise:/app/analise:ro
      - ./classificador:/app/classificador:ro
      - ./docs:/app/docs
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
      - ./data/bruto:/app/data/bruto:ro
      - ./seeds:/app/seeds:ro

  # M3/M4: app Next.js. Lê só mart.* e resultado.* com o papel app_ro; sobe depois que o loader termina com sucesso.
  app:
    build:
      context: ./app
    depends_on:
      loader:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://app_ro:${APP_RO_PASSWORD:-acaso_ro_dev}@db:5432/${POSTGRES_DB:-acaso}
    ports:
      - "${APP_HOST_PORT:-3000}:3000"

  # Testes do app (vitest, inclui a fumaça contra o banco do compose). Só roda com: docker compose --profile testes run --rm app-testes
  app-testes:
    profiles: ["testes"]
    build:
      context: ./app
      target: testes
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app_ro:${APP_RO_PASSWORD:-acaso_ro_dev}@db:5432/${POSTGRES_DB:-acaso}

volumes:
  pgdata:

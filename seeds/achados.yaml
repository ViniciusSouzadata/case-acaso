# Achados em linguagem leiga (pedido 12, 14/11/2026): frases curtas, falando de pessoas; o que é técnico de verdade fica em `tecnico`.
# Os números não mudam: conferidos contra resultado.* e docs/robustez_recusa.md em 14/11 (−16,41 [−21,35; −11,47] e −2,91 [−7,99; +2,16] de efeito_fator;
# 20/11/2023: 26,4% (n=197) → 21,5% (n=65); 33 semanas testadas, 1 com p<0,05 por analise.semana.contar_semanas_significativas; 132 recusas em 131 IPs).
# numero_destaque, rotulo_destaque e acao_curta (opcionais): cartão curto da Tela 2. tecnico (opcional): bloco recolhido "Para conferir (técnico)".
# Achados aprovados pelo Vinícius (ponto de controle 1, 12/11/2026); a redação leiga foi pedida pelo planejador em 14/11/2026.
- ordem: 1
  titulo: "Quando o assistente se recusa a responder, a pessoa quase não volta"
  numero_destaque: "−16"
  rotulo_destaque: "a cada 100 pessoas"
  acao_curta: "Medir as recusas todo mês e rever as que não precisavam acontecer."
  evidencia: >-
    De 2.372 pessoas novas, 132 receberam uma recusa logo na primeira resposta. Dessas 132, só 13 voltaram em até
    7 dias (10 a cada 100). Entre as 2.240 que não receberam recusa, voltaram 553 (25 a cada 100). Comparando pessoas
    parecidas (mesmo assunto, idioma, aparelho, horário, região e época), a diferença continua: 16 a menos voltam, a
    cada 100 (pode ser de 11 a 21 a menos). Testamos de outras formas — mudando a forma de reconhecer a mesma pessoa,
    ou exigindo que a volta seja em outro dia — e o resultado se mantém. As recusas não vêm de poucas pessoas: são 132
    recusas em 131 endereços diferentes.
  decisao: >-
    Acompanhar todo mês quantas pessoas recebem recusa, do mesmo jeito que se acompanha quantas voltam. Rever os
    pedidos que o assistente recusa sem precisar. Antes de mudar para todo mundo, testar: metade das pessoas recebe a
    recusa de hoje, metade recebe uma recusa que oferece uma alternativa. Só esse teste prova que a recusa é a causa.
  limite: >-
    Isto é uma comparação, não um teste controlado. Pode ser que a recusa só mostre que a pessoa pediu algo que o
    produto não faz, e ela não voltaria de qualquer jeito. O grupo com recusa é pequeno (132 pessoas). As conversas
    ofensivas foram retiradas da base por quem a publicou, então vemos só parte das recusas. Quem marcou o que é recusa
    foi uma IA, conferida à mão em 200 conversas (acerta 92%).
  tecnico: >-
    Entre pessoas parecidas (regressão logística, efeito marginal médio): −16,4 p.p., intervalo de 95% de −21,4 a −11,5.
    Se "voltar" exigir outro dia: 9 de 132 (6,8%) contra 391 de 2.240 (17,5%), −11,5 p.p. (de −15,7 a −7,3). É o único
    fator do assistente que resiste à correção de Benjamini-Hochberg para muitas comparações. E-value 5,3. Segundo
    método (ponderação por propensão): não comparável, porque os grupos diferem demais no perfil. Robustez: de −14,4 a
    −16,4 p.p. nas quatro definições de usuário e sessão; −16,3 p.p. com burn-in maior; 132 recusas em 131 IPs; mesma
    direção nos 5 temas com recusas suficientes. Rótulo da recusa: IA validada em 200 conversas (precisão 81% e
    revocação 86%, ponderadas pela população). Com as regras de palavras-chave, a diferença era −3,3 p.p. (de −10,1 a
    +3,5), porque os falsos alarmes a diluíam.
- ordem: 2
  titulo: "O modelo mais caro (GPT-4) não fez mais gente voltar"
  numero_destaque: "Sem ganho"
  rotulo_destaque: "GPT-4 no lugar do GPT-3.5"
  acao_curta: "Não pagar por um modelo mais caro esperando mais retorno."
  evidencia: >-
    Comparando pessoas parecidas, quem foi atendido pelo GPT-4 não voltou mais do que quem foi atendido pelo GPT-3.5: a
    diferença foi de 3 a menos a cada 100, dentro da margem de erro (de 8 a menos até 2 a mais). Os dados não mostram
    ganho e praticamente descartam um ganho maior que 2 a cada 100. O tamanho da resposta e a resposta em outro idioma
    também não mudaram o retorno de forma clara.
  decisao: >-
    Não pagar por um modelo mais caro esperando que mais gente volte. Se a troca for feita por outro motivo (qualidade,
    por exemplo), medir o efeito com um teste controlado.
  limite: >-
    Com esta quantidade de pessoas, só dá para enxergar diferenças a partir de uns 5 a cada 100. Diferenças menores
    podem existir e passar despercebidas. E é uma comparação entre pessoas que receberam modelos diferentes, não um
    teste controlado.
  tecnico: >-
    GPT-4 contra GPT-3.5, efeito marginal médio: −2,9 p.p. (de −8,0 a +2,2). Segundo método (comparação ponderada):
    −6,1 p.p. (de −12,7 a +0,4). Efeito mínimo detectável: 4,9 p.p. com grupos iguais. Tamanho da resposta: de −1,5 a
    +4,7 p.p. conforme a faixa; resposta em outro idioma: +0,1 p.p. (de −7,7 a +7,9). Nenhum desses se distingue de
    zero e nenhum passa na correção de Benjamini-Hochberg.
- ordem: 3
  titulo: "Uma semana ruim sozinha não é sinal de problema"
  numero_destaque: "1 de 33"
  rotulo_destaque: "semanas teve queda fora do normal"
  acao_curta: "Só soar o alarme quando a queda for maior que a oscilação normal."
  evidencia: >-
    A maior queda que apareceu foi na semana de 1º/05/2023: 17 pontos a menos que nas duas semanas anteriores. Parecia
    grave. Mas aquelas duas semanas eram as primeiras da base, e nelas pessoas antigas foram contadas como novas — e
    gente antiga volta mais. Comparando com as quatro semanas seguintes, a queda cai para cerca de 8 pontos, dentro da
    oscilação normal. Na semana de 20/11/2023 voltaram 22 de cada 100 (65 pessoas), contra 26 antes (197 pessoas):
    também oscilação normal. Das 33 semanas testadas, só 1 teve queda fora do normal; por puro acaso seriam esperadas
    umas 2.
  decisao: >-
    O alerta do painel só dispara quando a queda é maior que a oscilação normal e ignora as primeiras semanas da base.
    É a mesma lição do incidente: antes de soar o alarme, conferir se a forma de contar está certa.
  limite: >-
    Cada semana tem poucas pessoas novas (de 33 a 197), então só quedas grandes aparecem. E não temos o histórico de
    mudanças do produto para explicar por que cada semana variou.
  tecnico: >-
    Semana de 01/05/2023 contra as duas semanas anteriores: −17,1 p.p. (p = 0,013). Com a base de comparação começando
    pelo menos 28 dias depois do primeiro dado (as quatro semanas seguintes): −7,7 p.p. (p = 0,13). Semana de
    20/11/2023: −4,9 p.p. (p = 0,43), 21,5% (n = 65) contra 26,4% (n = 197). Nas 33 semanas testadas, 1 teve p < 0,05;
    por acaso seriam esperadas cerca de 2.
